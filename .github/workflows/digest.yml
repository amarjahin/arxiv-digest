name: Daily arXiv digest

on:
  schedule:
    # 13:00 UTC = 09:00 ET (during EDT). arXiv announces ~8pm ET the prior day,
    # so this delivers a fresh batch each weekday morning. Cron is in UTC.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:    # allow manual runs from the Actions tab

jobs:
  email-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Materialize config.yaml from secret
        env:
          ARXIV_DIGEST_CONFIG: ${{ secrets.ARXIV_DIGEST_CONFIG }}
        run: |
          if [ -z "$ARXIV_DIGEST_CONFIG" ]; then
            echo "::error::Secret ARXIV_DIGEST_CONFIG is not set. Paste your config.yaml contents into the repo secret."
            exit 1
          fi
          printf '%s' "$ARXIV_DIGEST_CONFIG" > config.yaml

      - name: Mask personal addresses in logs
        # Pulls every email address out of the rendered config and registers
        # it with ::add-mask:: so it shows as *** in any subsequent log line.
        # Keeps recipient/sender/SMTP-username out of public Actions logs.
        run: |
          python - <<'PY'
          import re, yaml
          cfg = yaml.safe_load(open("config.yaml")) or {}
          email = cfg.get("email") or {}
          addrs = set(email.get("to") or [])
          for k in ("from_addr", "username"):
              v = email.get(k)
              if v:
                  addrs.add(v)
          ua = (cfg.get("http") or {}).get("user_agent", "") or ""
          for tok in re.findall(r"[\w.+-]+@[\w.-]+", ua):
              if "example.com" not in tok:
                  addrs.add(tok)
          for a in sorted(addrs):
              print(f"::add-mask::{a}")
          PY

      - name: Run digest and send email
        env:
          ARXIV_DIGEST_SMTP_PASSWORD: ${{ secrets.ARXIV_DIGEST_SMTP_PASSWORD }}
        run: arxiv-digest run --config config.yaml --email
