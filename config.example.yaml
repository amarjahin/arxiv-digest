# arxiv-digest example config. Copy to `config.yaml` and edit.

categories:
  - hep-th
  - cond-mat.str-el

authors:
  # Each entry is either a bare "Given Surname" string or a dict
  # {surname: ..., given: ...} for explicit control.
  # Matching is case-insensitive and accent-folded; surnames must match
  # as whole tokens (so "Lee" won't match "Leeson").
  - "Edward Witten"
  - "Maldacena"            # surname only — matches any first name
  - surname: "Polchinski"
    given: "Joseph"        # disambiguate via given name

keywords:
  any_of:
    - "holography"
    - "black hole entropy"

exclude:
  authors: []
  keywords: []

output:
  dir: "./digests"
  format: markdown
  include_abstract: true
  group_by: category       # category | author | none
  random_count: 0          # extra random picks from unmatched papers, appended at end
  keep_days: 7             # delete digests older than this many days (omit to keep all)

http:
  # Please use a descriptive User-Agent with a contact email. arXiv asks
  # for it in their API terms of use.
  user_agent: "arxiv-digest/0.1 (you@example.com)"
  min_interval_seconds: 3
  timeout_seconds: 20

# Daily scheduled run. After editing, install it with:
#   arxiv-digest schedule install
# (macOS only for now; uses launchd. Linux/Windows are planned.)
schedule:
  enabled: false
  hour: 8       # 24-hour local time
  minute: 0

# Desktop notification at the end of a run, showing the match count.
notify:
  enabled: false
  open_on_click: true   # click the banner to open the digest folder (macOS)

# Set true if you also want papers marked "replaced" by arXiv today.
include_replacements: false
