[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-digest"
version = "0.1.0"
description = "Daily arXiv submissions digest filtered by author and keyword."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Amar Jahin" }]
license = { text = "MIT" }
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_digest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that hit the live arXiv API (deselected by default)"]
addopts = "-m 'not live'"
